[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predik-auth"
version = "1.0.0"
description = "Login obligatorio para apps Predik: broker SAML (PHP) + integración FastAPI"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["predik_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
